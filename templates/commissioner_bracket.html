{% extends "base.html" %}
{% block content %}

<div class="card">
  <h3 style="margin-top:0;">Commissioner — Generate Model Bracket Post</h3>
  <div class="muted">Paste the official draw (one entry per line). Use BYE, Q, LL, WC if needed.</div>
</div>

<div class="card">
  <form id="commissionerForm" method="post" action="/commissioner/bracket/generate">
  <form method="post" action="/commissioner/bracket/generate">
    <label class="muted">Commissioner key</label>
    <input name="commissioner_key" type="password" required />

    <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:12px;">
      <div style="min-width:220px; flex:1;">
        <label class="muted">Event</label>
        <select name="event_short" style="width:100%;">
          {% for ev in events %}
            <option value="{{ ev.short_id }}">{{ ev.short_id }} — {{ ev.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div style="min-width:160px;">
        <label class="muted">Surface</label>
        <select name="surface" style="width:100%;">
          <option>Hard</option><option>Clay</option><option>Grass</option><option>Unknown</option>
        </select>
      </div>

      <div style="min-width:160px;">
        <label class="muted">Level</label>
        <select name="tourney_level" style="width:100%;">
          <option value="G">G (Slam)</option>
          <option value="M">M (Masters)</option>
          <option value="500">500</option>
          <option value="250">250</option>
        </select>
      </div>

      <div style="min-width:140px;">
        <label class="muted">Best of</label>
        <select name="best_of" style="width:100%;">
          <option value="5">5</option>
          <option value="3" selected>3</option>
        </select>
      </div>
    </div>

    <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:12px;">
      <div style="min-width:160px;">
        <label class="muted">Sims</label>
        <input name="n_sims" type="number" value="5000" min="200" step="100" />
      </div>
      <div style="min-width:160px;">
        <label class="muted">Seed</label>
        <input name="seed" type="number" value="42" />
      </div>
      <div style="min-width:160px;">
        <label class="muted">Date (YYYYMMDD)</label>
        <input name="tourney_date" type="number" value="20260101" />
      </div>
    </div>

    <div style="margin-top:14px;">
      <label class="muted">Draw entries (one per line)</label>
      <textarea name="draw_text" rows="18" style="width:100%; padding:10px;" placeholder="Player 1&#10;BYE&#10;Player 2&#10;Player 3&#10;..."></textarea>
    </div>
    

    <button type="submit">Generate public post</button>
    <div id="comm_status" class="muted" style="margin-top:10px;"></div>
  </form>
</div>
<script>
  function esc(s) {
    return String(s || "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function parseLines(raw) {
    return (raw || "").split("\n").map(s => s.trim()).filter(Boolean);
  }

  async function postJson(url, obj) {
    const r = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(obj),
    });
    const text = await r.text();
    if (!r.ok) throw new Error(text || ("HTTP " + r.status));
    return JSON.parse(text);
  }

  const form = document.getElementById("commissionerForm");
  const status = document.getElementById("comm_status");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    status.textContent = "";

    const ta = form.querySelector('textarea[name="draw_text"]');
    const entries = parseLines(ta.value);

    if (entries.length < 2) {
      status.textContent = "Please paste a draw (at least 2 lines).";
      return;
    }

    status.textContent = "Validating names...";

    try {
      const v = await postJson("/api/draw/validate", { players: entries });

      if ((v.unmatched || []).length > 0) {
        const items = v.unmatched.map(u => {
          const sug = (u.suggestions || []).slice(0, 5);
          const sugTxt = sug.length ? ` (suggestions: ${sug.map(esc).join(", ")})` : "";
          return `<li><b>${esc(u.input)}</b>${sugTxt}</li>`;
        }).join("");

        status.innerHTML = `
          <div style="color:#b00020;">
            Unknown / misspelled players detected:
            <ul style="margin:6px 0 0 18px;">${items}</ul>
          </div>
        `;
        return;
      }

      // Overwrite textarea with canonical matched names
      ta.value = (v.matched || entries).join("\n");

      status.textContent = "";
      form.submit(); // proceed

    } catch (err) {
      console.error(err);
      status.innerHTML = `<div style="color:#b00020; white-space:pre-wrap;">${esc(String(err))}</div>`;
    }
  });
</script>

{% endblock %}
