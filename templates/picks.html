{% extends "base.html" %}
{% block content %}

<div class="card">
  <h3 style="margin-top:0;">Enter / Update Your Pick</h3>
  <form action="/picks" method="post">
    <label class="muted">Your name</label><br/>
    <select name="person" required>
        <option value="" disabled {% if not selected_person %}selected{% endif %}>Select your name</option>
        {% for p in people %}
          <option value="{{ p }}" {% if p == selected_person %}selected{% endif %}>{{ p }}</option>
        {% endfor %}
      </select>
    
    <div style="margin-top:12px; padding:8px; background-color:rgba(255,255,255,0.05); border-radius:4px; width:100%; box-sizing:border-box;">
      <div class="muted" style="margin-bottom:6px; font-size:0.9em;">Don't see your name?</div>
      <input id="new_person_input" placeholder="e.g., John" style="margin-bottom:6px; font-size:0.9em; padding:4px 8px; width:100%; box-sizing:border-box;" />
      <button type="button" onclick="addPersonQuick()" style="padding:6px 12px; font-size:0.9em;">Add & Continue</button>
    </div>

    <br/><br/>
    <label class="muted">Event</label><br/>
    <select name="event_id" required>
        <option value="" disabled {% if not selected_event_id %}selected{% endif %}>Select event</option>
        {% for e in events %}
          <option value="{{ e.id }}" {% if e.id == selected_event_id %}selected{% endif %}>
            {{ e.short_id }} — {{ e.name }}
          </option>
        {% endfor %}
      </select>

    <br/><br/>
    <label class="muted">Player</label><br/>
    <input id="pick_player" name="player" placeholder="e.g., Jannik Sinner" required />

    <br/><br/>
    <button type="submit">Save Pick</button>
  </form>

  <p class="muted" style="margin-bottom:0;">
    One pick per event. Submitting again overwrites your previous pick for that event. 
  </p>
</div>
<script>
    wireAutocomplete("pick_player", "/api/players");
    
    async function addPersonQuick() {
      const name = document.getElementById('new_person_input').value.trim();
      if (!name) {
        alert('Please enter a name');
        return;
      }
      
      try {
        const res = await fetch('/add_person', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: 'name=' + encodeURIComponent(name)
        });
        
        if (res.ok) {
          // Refresh the person dropdown
          location.reload();
        } else {
          alert('Error adding person. Try again.');
        }
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }
    
    // Allow Enter key to add person
    document.getElementById('new_person_input')?.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        addPersonQuick();
      }
    });
  </script>
{% endblock %}
