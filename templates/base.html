<!doctype html>
<html>
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
      
        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
        
        <link rel="icon" type="image/png" href="/static/favicon.ico">
        <title>ATP Predictions</title>
      
        <style>
          :root {
            --bg-deep: #0a2240;
            --bg-mid: #123a6b;
            --bg-glow: #1e5f94;

            --panel: rgba(9, 28, 54, 0.58);
            --panel-border: rgba(146, 197, 255, 0.24);

            --card: rgba(236, 246, 255, 0.93);
            --card-border: rgba(12, 51, 92, 0.14);

            --text-strong: #eaf4ff;
            --text-main: #0f2745;
            --text-muted: #4b6788;
            --text-link: #d7ebff;

            --border-soft: rgba(15, 39, 69, 0.18);
            --focus-ring: rgba(73, 166, 255, 0.48);

            --space-1: 6px;
            --space-2: 10px;
            --space-3: 14px;
            --space-4: 18px;
            --space-5: 24px;
            --space-6: 32px;

            --radius-sm: 10px;
            --radius-md: 14px;
            --radius-lg: 20px;
          }
      
          body {
            font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            background:
              radial-gradient(1200px 600px at 20% -10%, rgba(83, 170, 255, 0.24), transparent 60%),
              radial-gradient(900px 500px at 95% 0%, rgba(72, 142, 211, 0.20), transparent 55%),
              linear-gradient(165deg, var(--bg-deep), var(--bg-mid) 58%, var(--bg-glow));
            color: var(--text-strong);
            max-width: 1080px;
            margin: 0 auto;
            padding: var(--space-6) var(--space-5) 42px;
            min-height: 100vh;
          }
      
          h1, h2, h3, h4 {
            font-family: 'Playfair Display', serif;
            letter-spacing: 0.3px;
            margin: 0;
          }

          h2 {
            font-size: clamp(1.55rem, 2.4vw, 2rem);
            line-height: 1.1;
          }
      
          header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: var(--space-4);
            margin-bottom: var(--space-3);
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-lg);
            padding: var(--space-4) var(--space-5);
            box-shadow: 0 18px 50px rgba(2, 11, 24, 0.32);
            backdrop-filter: blur(5px);
          }

          @media (max-width: 820px) {
            header {
              flex-direction: column;
              align-items: flex-start;
              gap: var(--space-3);
            }
          }

          nav {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: var(--space-2);
          }

          .nav-dropdown {
            position: relative;
            display: inline-block;
            }

            .nav-dropdown button {
            margin-top: 0;
            padding: 9px 12px;
            background: rgba(232, 246, 255, 0.08);
            color: var(--text-link);
            border: 1px solid rgba(186, 223, 255, 0.3);
            border-radius: 999px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.93rem;
            transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
            }

            .nav-dropdown button:hover {
            background: rgba(232, 246, 255, 0.15);
            color: #ffffff;
            }

            .nav-dropdown button.active {
            background: #ecf6ff;
            color: #11345d;
            border-color: rgba(17, 52, 93, 0.22);
            }

            .nav-menu {
            position: absolute;
            right: 0;
            top: calc(100% + 8px);
            min-width: 200px;
            background: #fff;
            color: #111;
            border-radius: 14px;
            border: 1px solid rgba(0,0,0,0.15);
            box-shadow: 0 16px 36px rgba(0,0,0,0.16);
            padding: 6px;
            display: none;
            z-index: 9999;
            }

            .nav-menu a {
            display: block;
            padding: 10px 12px;
            margin: 0;
            color: #111;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            }

            .nav-menu a:hover {
            background: rgba(0,0,0,0.06);
            }
            
            .nav-menu.open {
              display: block;
            }
      
          nav a {
            color: var(--text-link);
            text-decoration: none;
            margin-right: 0;
            padding: 9px 12px;
            border-radius: 999px;
            border: 1px solid rgba(186, 223, 255, 0.28);
            background: rgba(232, 246, 255, 0.08);
            font-weight: 600;
            font-size: 0.93rem;
            transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
          }
      
          nav a:hover {
            background: rgba(232, 246, 255, 0.15);
            color: #ffffff;
          }

          nav a.active {
            background: #ecf6ff;
            color: #11345d;
            border-color: rgba(17, 52, 93, 0.22);
          }

          .nav-dropdown button {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin: 0;
            line-height: 1;
          }

          .caret {
            font-size: 0.72rem;
            transition: transform 0.18s ease;
          }

          .nav-dropdown button[aria-expanded="true"] .caret {
            transform: rotate(180deg);
          }
      
          hr {
            border: none;
            border-top: 1px solid rgba(190, 222, 255, 0.25);
            margin: var(--space-4) 0 var(--space-6);
          }
      
          .card {
            background: var(--card);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            border-radius: var(--radius-lg);
            padding: var(--space-5);
            margin: var(--space-5) 0;
            box-shadow: 0 14px 38px rgba(6, 26, 52, 0.20);
          }

          .card h1,
          .card h2,
          .card h3,
          .card h4,
          .card p,
          .card label,
          .card li,
          .card td,
          .card th {
            color: var(--text-main);
          }
      
          table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 12px;
            font-size: 0.95rem;
          }
      
          th, td {
            border-bottom: 1px solid var(--border-soft);
            padding: var(--space-2) var(--space-1);
            text-align: left;
          }
      
          th { 
            font-weight: 600;
            color: #163a63;
          }
      
          td.points {
            text-align: left;
            font-weight: 600;
          }
      
          td.rank {
            text-align: left;
            font-size: 1.1rem;
          }
      
          .leader-gold   { background: rgba(255, 215, 0, 0.18); }
          .leader-silver { background: rgba(255, 255, 255, 0.12); }
          .leader-bronze { background: rgba(205, 127, 50, 0.18); }
      
          input, select {
            padding: 11px 12px;
            margin-top: var(--space-1);
            width: 100%;
            max-width: 520px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-soft);
            background: #ffffff;
            color: #0f2745;
            font-size: 0.95rem;
            transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
          }

          input:focus,
          select:focus {
            outline: none;
            border-color: #4ea1f0;
            box-shadow: 0 0 0 4px var(--focus-ring);
          }
      
          button {
            margin-top: var(--space-3);
            padding: 10px 17px;
            border: 1px solid rgba(7, 28, 56, 0.28);
            background: linear-gradient(180deg, #153f70, #0f2f58);
            color: #f7fbff;
            border-radius: var(--radius-sm);
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(8, 26, 50, 0.2);
            transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
          }
      
          button:hover {
            filter: brightness(1.05);
            transform: translateY(-1px);
            box-shadow: 0 10px 22px rgba(8, 26, 50, 0.26);
          }

          button:active {
            transform: translateY(0);
            filter: brightness(0.98);
          }
      
          .muted {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
          }
          .pie {
            max-width: 720px;  
            max-height: 720px;
            margin: 12px auto;
            display: block;
          }

          .autocomplete-box{
            position:absolute;
            z-index:9999;
            background:#fff;
            color:#111;                     
            border:1px solid rgba(0,0,0,0.15);
            border-radius:10px;
            margin-top:4px;
            max-height:220px;
            overflow-y:auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            display:none;
            }
                    
            .autocomplete-item{
            padding:10px 12px;
            cursor:pointer;
            color:#111;                   
            }

            .autocomplete-item:hover{
            background: rgba(0,0,0,0.06);
            }
              /* Autocomplete dropdown styling */
            .sug-box {
              background: #fff !important;
              color: #111 !important;
              border: 1px solid rgba(0,0,0,0.15) !important;
            }

            .sug-box .sug-item {
              color: #111 !important;
              background: #fff !important;
            }

            .sug-box .sug-item:hover {
              background: rgba(0,0,0,0.06) !important;
            }
            /* Wrapper around each input + dropdown */
            .ac-wrap {
              position: relative;
            }

            /* The dropdown list */
            .ac-list {
              position: absolute;
              left: 0;
              right: 0;
              top: calc(100% + 4px);
              background: #fff;     /* IMPORTANT: opaque background so nothing shows through */
              z-index: 9999;        /* IMPORTANT: above any underline/borders */
              border-radius: 10px;
              box-shadow: 0 10px 30px rgba(0,0,0,0.12);
              overflow: hidden;
            }

            /* If your underline is a pseudo element, force it below */
            .ac-underline,
            .ac-wrap::after {
              z-index: 1;
            }
            .ac-input {
              position: relative;
              z-index: 2;
            }
        </style>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script>
            async function wireAutocomplete(inputId, apiPath) {
              const input = document.getElementById(inputId);
              if (!input) return;
            
              input.setAttribute("autocomplete", "off");
            
              const box = document.createElement("div");
              box.className = "autocomplete-box";
              document.body.appendChild(box);
            
              function positionBox() {
                const r = input.getBoundingClientRect();
                box.style.left = (window.scrollX + r.left) + "px";
                box.style.top  = (window.scrollY + r.bottom) + "px";
                box.style.width = r.width + "px";
              }
            
              let controller = null;
                let lastQ = "";
                let debounceTimer = null;
                let reqSeq = 0;          // increments per request
                let lastRenderedSeq = 0; // only render latest

                async function runSearch(q, mySeq) {
                if (controller) controller.abort();
                controller = new AbortController();

                positionBox();
                box.innerHTML = `<div class="autocomplete-item" style="color:#666;">Searching…</div>`;
                box.style.display = "block";

                try {
                    const res = await fetch(`${apiPath}?q=${encodeURIComponent(q)}&limit=12`, {
                    signal: controller.signal
                    });
                    const names = await res.json();

                    // ✅ stale response guard (prevents out-of-order rendering)
                    if (mySeq < reqSeq) return;

                    lastRenderedSeq = mySeq;

                    if (!Array.isArray(names) || names.length === 0) {
                    box.innerHTML = `<div class="autocomplete-item" style="color:#666;">No matches</div>`;
                    return;
                    }

                    box.innerHTML = "";
                    for (const name of names) {
                    const item = document.createElement("div");
                    item.className = "autocomplete-item";
                    item.textContent = name;
                    item.onmousedown = (e) => {
                        e.preventDefault();
                        input.value = name;
                        box.style.display = "none";
                    };
                    box.appendChild(item);
                    }
                } catch (e) {
                    // ignore aborts, hide on real errors
                    if (e.name !== "AbortError") box.style.display = "none";
                }
                }

                function update() {
                const q = (input.value || "").trim();
                if (q.length < 2) { box.style.display = "none"; return; }
                if (q === lastQ) return;
                lastQ = q;

                // ✅ debounce (wait briefly after typing stops)
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    reqSeq += 1;
                    runSearch(q, reqSeq);
                }, 150);
                }
            
              input.addEventListener("input", update);
              input.addEventListener("focus", () => { positionBox(); update(); });
            
              window.addEventListener("resize", positionBox);
              window.addEventListener("scroll", positionBox);
            
              input.addEventListener("blur", () => {
                setTimeout(() => box.style.display = "none", 150);
              });
            }
            </script>
            
      </head>
            
<body>
  {% set current_path = request.url.path %}
  <header>
    <div>
      <h2>ATP Predictions</h2>
      <div class="muted">Season {{year}}</div>
    </div>
    <nav>
        <a href="/" class="{% if current_path == '/' %}active{% endif %}">Standings</a>
        <a href="/help" class="{% if current_path.startswith('/help') %}active{% endif %}">Help</a>
        <a href="/breakdown" class="{% if current_path.startswith('/breakdown') %}active{% endif %}">Breakdown</a>
        <a href="/picks" class="{% if current_path.startswith('/picks') %}active{% endif %}">Enter Picks</a>
        <div class="nav-dropdown">
          <button type="button" id="modelBtn" class="{% if current_path.startswith('/predict') or current_path.startswith('/draw') or current_path.startswith('/model/picks') %}active{% endif %}" aria-expanded="false" aria-controls="modelMenu">Model <span class="caret">▾</span></button>
          <div class="nav-menu" id="modelMenu">
            <a href="/predict">Predict</a>
            <a href="/draw">Draw Simulator</a>
            <a href="/model/picks">Model Picks</a>
          </div>
        </div>
        <div class="nav-dropdown">
          <button type="button" id="commBtn" class="{% if current_path.startswith('/model') or current_path.startswith('/results') or current_path.startswith('/commissioner') %}active{% endif %}" aria-expanded="false" aria-controls="commMenu">Admin <span class="caret">▾</span></button>
          <div class="nav-menu" id="commMenu">
            <a href="/model">Model</a>
            <a href="/results">Enter Results</a>
            <a href="/commissioner/bracket">Bracket Post</a>
          </div>
        </div>
      </nav>
  </header>
  <hr/>
  {% block content %}{% endblock %}
  <script>
    function closeAllMenus() {
      document.querySelectorAll(".nav-menu").forEach((m) => m.classList.remove("open"));
      document.querySelectorAll(".nav-dropdown > button").forEach((b) => b.setAttribute("aria-expanded", "false"));
    }

    document.querySelectorAll(".nav-dropdown > button").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        const menu = btn.nextElementSibling;
        const willOpen = !menu.classList.contains("open");
  
        closeAllMenus();
  
        if (willOpen) {
          menu.classList.add("open");
          btn.setAttribute("aria-expanded", "true");
        }

        e.stopPropagation();
      });
    });
  
    document.addEventListener("click", closeAllMenus);
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeAllMenus();
    });
  </script>  
</body>
</html>
