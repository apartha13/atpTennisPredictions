<!doctype html>
<html>
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
      
        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
        
        <link rel="icon" type="image/png" href="/static/favicon.ico">
        <title>ATP Predictions</title>
      
        <style>
          :root {
            --bg-blue: #0049a2;
            --card-blue: #6acde3;
            --text-white: #ffffff;
            --text-muted: rgba(255,255,255,0.85);
            --border-light: rgba(0, 0, 0, 0.25);
          }
      
          body {
            font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            background: var(--bg-blue);
            color: var(--text-white);
            max-width: 1000px;
            margin: 0 auto;
            padding: 32px 20px;
          }
      
          h1, h2, h3, h4 {
            font-family: 'Playfair Display', serif;
            letter-spacing: 0.3px;
          }
      
          header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 12px;
          }

          .nav-dropdown {
            position: relative;
            display: inline-block;
            }

            .nav-dropdown button {
            margin-top: 0;
            padding: 0;
            background: transparent;
            color: var(--text-white);
            border: none;
            font-weight: 500;
            cursor: pointer;
            font-size: 1rem;
            }

            .nav-menu {
            position: absolute;
            right: 0;
            top: 26px;
            min-width: 180px;
            background: #fff;
            color: #111;
            border-radius: 12px;
            border: 1px solid rgba(0,0,0,0.15);
            box-shadow: 0 12px 30px rgba(0,0,0,0.12);
            padding: 6px;
            display: none;
            z-index: 9999;
            }

            .nav-menu a {
            display: block;
            padding: 10px 12px;
            margin: 0;
            color: #111;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            }

            .nav-menu a:hover {
            background: rgba(0,0,0,0.06);
            }
            
            .nav-menu.open {
              display: block;
            }
      
          nav a {
            color: var(--text-white);
            text-decoration: none;
            margin-right: 14px;
            font-weight: 500;
          }
      
          nav a:hover {
            text-decoration: underline;
          }

          .nav-dropdown button {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 0;             /* or 2px 0 if you want a bigger click target */
            margin: 0;
            line-height: 1;
          }
      
          hr {
            border: none;
            border-top: 1px solid var(--border-light);
            margin: 16px 0 28px;
          }
      
          .card {
            background: var(--card-blue);
            border-radius: 16px;
            padding: 22px;
            margin: 22px 0;
            box-shadow: 0 10px 24px rgba(0,0,0,0.08);
          }
      
          table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 12px;
            font-size: 0.95rem;
          }
      
          th, td {
            border-bottom: 1px solid var(--border-light);
            padding: 10px 8px;
            text-align: left;
          }
      
          th { 
            font-weight: 600;
            color: var(--text-white);
          }
      
          td.points {
            text-align: left;
            font-weight: 600;
          }
      
          td.rank {
            text-align: left;
            font-size: 1.1rem;
          }
      
          .leader-gold   { background: rgba(255, 215, 0, 0.18); }
          .leader-silver { background: rgba(255, 255, 255, 0.12); }
          .leader-bronze { background: rgba(205, 127, 50, 0.18); }
      
          input, select {
            padding: 10px;
            margin-top: 6px;
            width: 100%;
            max-width: 520px;
            border-radius: 10px;
            border: none;
            font-size: 0.95rem;
          }
      
          button {
            margin-top: 12px;
            padding: 10px 16px;
            border: none;
            background: #111;
            color: #fff;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
          }
      
          button:hover {
            opacity: 0.9;
          }
      
          .muted {
            color: var(--text-muted);
            font-size: 0.9rem;
          }
          .pie {
            max-width: 720px;  
            max-height: 720px;
            margin: 12px auto;
            display: block;
          }

          .autocomplete-box{
            position:absolute;
            z-index:9999;
            background:#fff;
            color:#111;                     
            border:1px solid rgba(0,0,0,0.15);
            border-radius:10px;
            margin-top:4px;
            max-height:220px;
            overflow-y:auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            display:none;
            }
                    
            .autocomplete-item{
            padding:10px 12px;
            cursor:pointer;
            color:#111;                   
            }

            .autocomplete-item:hover{
            background: rgba(0,0,0,0.06);
            }
              /* Autocomplete dropdown styling */
            .sug-box {
              background: #fff !important;
              color: #111 !important;
              border: 1px solid rgba(0,0,0,0.15) !important;
            }

            .sug-box .sug-item {
              color: #111 !important;
              background: #fff !important;
            }

            .sug-box .sug-item:hover {
              background: rgba(0,0,0,0.06) !important;
            }
            /* Wrapper around each input + dropdown */
            .ac-wrap {
              position: relative;
            }

            /* The dropdown list */
            .ac-list {
              position: absolute;
              left: 0;
              right: 0;
              top: calc(100% + 4px);
              background: #fff;     /* IMPORTANT: opaque background so nothing shows through */
              z-index: 9999;        /* IMPORTANT: above any underline/borders */
              border-radius: 10px;
              box-shadow: 0 10px 30px rgba(0,0,0,0.12);
              overflow: hidden;
            }

            /* If your underline is a pseudo element, force it below */
            .ac-underline,
            .ac-wrap::after {
              z-index: 1;
            }
            .ac-input {
              position: relative;
              z-index: 2;
            }
        </style>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script>
            async function wireAutocomplete(inputId, apiPath) {
              const input = document.getElementById(inputId);
              if (!input) return;
            
              input.setAttribute("autocomplete", "off");
            
              const box = document.createElement("div");
              box.className = "autocomplete-box";
              document.body.appendChild(box);
            
              function positionBox() {
                const r = input.getBoundingClientRect();
                box.style.left = (window.scrollX + r.left) + "px";
                box.style.top  = (window.scrollY + r.bottom) + "px";
                box.style.width = r.width + "px";
              }
            
              let controller = null;
                let lastQ = "";
                let debounceTimer = null;
                let reqSeq = 0;          // increments per request
                let lastRenderedSeq = 0; // only render latest

                async function runSearch(q, mySeq) {
                if (controller) controller.abort();
                controller = new AbortController();

                positionBox();
                box.innerHTML = `<div class="autocomplete-item" style="color:#666;">Searching…</div>`;
                box.style.display = "block";

                try {
                    const res = await fetch(`${apiPath}?q=${encodeURIComponent(q)}&limit=12`, {
                    signal: controller.signal
                    });
                    const names = await res.json();

                    // ✅ stale response guard (prevents out-of-order rendering)
                    if (mySeq < reqSeq) return;

                    lastRenderedSeq = mySeq;

                    if (!Array.isArray(names) || names.length === 0) {
                    box.innerHTML = `<div class="autocomplete-item" style="color:#666;">No matches</div>`;
                    return;
                    }

                    box.innerHTML = "";
                    for (const name of names) {
                    const item = document.createElement("div");
                    item.className = "autocomplete-item";
                    item.textContent = name;
                    item.onmousedown = (e) => {
                        e.preventDefault();
                        input.value = name;
                        box.style.display = "none";
                    };
                    box.appendChild(item);
                    }
                } catch (e) {
                    // ignore aborts, hide on real errors
                    if (e.name !== "AbortError") box.style.display = "none";
                }
                }

                function update() {
                const q = (input.value || "").trim();
                if (q.length < 2) { box.style.display = "none"; return; }
                if (q === lastQ) return;
                lastQ = q;

                // ✅ debounce (wait briefly after typing stops)
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    reqSeq += 1;
                    runSearch(q, reqSeq);
                }, 150);
                }
            
              input.addEventListener("input", update);
              input.addEventListener("focus", () => { positionBox(); update(); });
            
              window.addEventListener("resize", positionBox);
              window.addEventListener("scroll", positionBox);
            
              input.addEventListener("blur", () => {
                setTimeout(() => box.style.display = "none", 150);
              });
            }
            </script>
            
      </head>
            
<body>
  <header>
    <div>
      <h2 style="margin:0;">ATP Predictions</h2>
      <div class="muted">Season {{year}}</div>
    </div>
    <nav>
        <a href="/">Standings</a>
        <a href="/help">Help</a>
        <a href="/breakdown">Breakdown</a>
        <a href="/picks">Enter Picks</a>
        <div class="nav-dropdown">
          <button type="button" id="modelBtn">Model ▾</button>
          <div class="nav-menu" id="modelMenu">
            <a href="/predict">Predict</a>
            <a href="/draw">Draw Simulator</a>
            <a href="/model/picks">Model Picks</a>
          </div>
        </div>
        <div class="nav-dropdown">
          <button type="button" id="commBtn">Admin ▾</button>
          <div class="nav-menu" id="commMenu">
            <a href="/model">Model</a>
            <a href="/results">Enter Results</a>
            <a href="/commissioner/bracket">Bracket Post</a>
          </div>
        </div>
      </nav>
  </header>
  <hr/>
  {% block content %}{% endblock %}
  <script>
    document.querySelectorAll(".nav-dropdown > button").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        const menu = btn.nextElementSibling;
  
        // close other menus
        document.querySelectorAll(".nav-menu").forEach((m) => {
          if (m !== menu) m.classList.remove("open");
        });
  
        // toggle this one
        menu.classList.toggle("open");
        e.stopPropagation();
      });
    });
  
    // click anywhere else closes all menus
    document.addEventListener("click", () => {
      document.querySelectorAll(".nav-menu").forEach((m) => m.classList.remove("open"));
    });
  </script>  
</body>
</html>
